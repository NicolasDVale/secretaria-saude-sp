    function garantirArray(val, fallback = []) {
      if (!val) return fallback;
      if (Array.isArray(val)) return val;
      if (typeof val === 'object') return Object.values(val);
      return fallback;
    }
    function garantirProgramasFixos(listaProgramas) {
      const lista = garantirArray(listaProgramas, []);
      const idsFixos = ['p_iep','p_dosecerta'];
      const filtrados = lista.filter(p => idsFixos.includes(p.id));
      const fixos = [
        { id:"p_iep", nome:"Instituto Estadual de Psicologia (IEP-SP)", categoria:"Saúde Mental & Perícia", descricao:"Acolhimento comunitário, perícias funcionais e regulação de urgências psiquiátricas no Hospital Jefferson.", link:"#/iep", ativo:true },
        { id:"p_dosecerta", nome:"Programa Dose Certa (Medicamentos)", categoria:"Assistência Farmacêutica", descricao:"Distribuição gratuita de medicamentos essenciais e de alto custo nas farmácias do Estado.", link:"#/medicamentos", ativo:true }
      ];
      let alterou = false;
      fixos.forEach(fixo => { if (!filtrados.find(p => p.id === fixo.id)) { filtrados.push(fixo); alterou = true; } });
      if (lista.length !== filtrados.length) alterou = true;
      return { lista: filtrados, alterou };
    }
    function garantirOrcamento(o) {
      const base = o && typeof o === 'object' ? o : {};
      return {
        total: Number(base.total) || 0,
        adicionais: garantirArray(base.adicionais, []),
        mensal: (base.mensal && typeof base.mensal === 'object') ? base.mensal : {},
        destinacoes: garantirArray(base.destinacoes, DADOS_INICIAIS.orcamento.destinacoes)
      };
    }
    function limparEConverterValor(val) {
      if (val === null || val === undefined || val === '') return 0;
      if (typeof val === 'number') return isNaN(val) ? 0 : val;
      let s = val.toString().replace(/R\$\s?/gi, '').trim();
      if (s.includes('.') && s.includes(',')) s = s.replace(/\./g, '').replace(',', '.');
      else if (s.includes(',')) s = s.replace(',', '.');
      s = s.replace(/[^0-9.-]/g, '');
      const num = parseFloat(s);
      return isNaN(num) ? 0 : Math.max(0, num);
    }
    function calcularFinancas() {
      const o = garantirOrcamento(app.orcamento);
      const loa = Number(o.total) || 0;
      const adicionais = garantirArray(o.adicionais, []);
      const totalAdic = adicionais.reduce((s, a) => s + Number(a.valor || 0), 0);
      const efetivo = loa + totalAdic;
      const dest = garantirArray(o.destinacoes, []);
      const executado = dest.reduce((s, d) => s + Number(d.valor || 0), 0);
      const saldo = Math.max(0, efetivo - executado);
      const perc = efetivo > 0 ? Math.min(100, (executado / efetivo) * 100) : 0;
      return { loa, adicionais, totalAdic, efetivo, dest, executado, saldo, perc, mensal: o.mensal || {} };
    }
    function processarArquivoImagem(event, hiddenInputId, previewImgId) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.onload = function() {
          const canvas = document.createElement('canvas');
          let width = img.width, height = img.height;
          const MAX_SIZE = 800;
          if (width > height && width > MAX_SIZE) { height = Math.round((height * MAX_SIZE) / width); width = MAX_SIZE; }
          else if (height > MAX_SIZE) { width = Math.round((width * MAX_SIZE) / height); height = MAX_SIZE; }
          canvas.width = width; canvas.height = height;
          canvas.getContext('2d').drawImage(img, 0, 0, width, height);
          const base64 = canvas.toDataURL('image/jpeg', 0.75);
          document.getElementById(hiddenInputId).value = base64;
          const prev = document.getElementById(previewImgId);
          if (prev) { prev.src = base64; prev.classList.remove('hidden'); }
          mostrarToast("Foto carregada!");
        };
        img.src = e.target.result;
      };
      reader.readAsDataURL(file);
    }

              if (dadosNuvem.webhookIep) app.webhookIep = dadosNuvem.webhookIep;

              if (dadosNuvem.orcamento) app.orcamento = garantirOrcamento(dadosNuvem.orcamento);
              if (dadosNuvem.iepEquipe) app.iepEquipe = garantirArray(dadosNuvem.iepEquipe, DADOS_INICIAIS.iepEquipe);
              if (dadosNuvem.medicamentos) app.medicamentos = garantirArray(dadosNuvem.medicamentos, DADOS_INICIAIS.medicamentos);

              if (dadosNuvem.programas) app.programas = garantirArray(dadosNuvem.programas, DADOS_INICIAIS.programas);
              if (dadosNuvem.noticias) app.noticias = garantirArray(dadosNuvem.noticias, DADOS_INICIAIS.noticias);

    function formatarMoeda(val) { return Number(val || 0).toLocaleString("pt-BR", { style: "currency", currency: "BRL" }); }
    function formatarCompacto(v) {
      v = Number(v) || 0; const abs = Math.abs(v);
      if (abs >= 1e9) return "R$ " + (v / 1e9).toLocaleString("pt-BR", { maximumFractionDigits: 2 }) + " bi";
      if (abs >= 1e6) return "R$ " + (v / 1e6).toLocaleString("pt-BR", { maximumFractionDigits: 1 }) + " mi";
      return formatarMoeda(v);
    }

    function renderizarGraficos(f) {
      if (!window.Chart) return;
      try {
        Chart.defaults.font.family = "Inter, sans-serif";
        const ctx1 = document.getElementById('graficoPizza');
        if (ctx1) {
          const ordenada = [...f.dest].sort((a, b) => Number(b.valor || 0) - Number(a.valor || 0));
          const top = ordenada.slice(0, 6);
          const outros = ordenada.slice(6).reduce((s, d) => s + Number(d.valor || 0), 0);
          const labels = top.map(d => d.nome);
          const valores = top.map(d => Number(d.valor || 0));
          if (outros > 0) { labels.push('Outras'); valores.push(outros); }
          if (graficoPizza) graficoPizza.destroy();
          graficoPizza = new Chart(ctx1, {
            type: 'doughnut',
            data: { labels, datasets: [{ data: valores, backgroundColor: CORES_GRAFICO, borderWidth: 2, borderColor: '#fff', hoverOffset: 8 }] },
            options: { maintainAspectRatio: false, cutout: '60%',
              plugins: { legend: { position: 'right', labels: { boxWidth: 12, padding: 10, font: { size: 10 } } },
                tooltip: { callbacks: { label: (c) => ' ' + formatarMoeda(c.parsed) } } } }
          });
        }
        const ctx2 = document.getElementById('graficoMensal');
        if (ctx2) {
          const vals = MESES.map((_, i) => Number(f.mensal[i + 1] || 0));
          const acum = []; let s = 0;
          vals.forEach(v => { s += v; acum.push(s); });
          if (graficoMensal) graficoMensal.destroy();
          graficoMensal = new Chart(ctx2, {
            data: { labels: MESES, datasets: [
              { type: 'bar', label: 'Execução mês', data: vals, backgroundColor: 'rgba(20,81,180,.85)', borderRadius: 4, order: 3 },
              { type: 'line', label: 'Acumulado', data: acum, borderColor: '#059669', backgroundColor: '#059669', tension: .35, pointRadius: 3, borderWidth: 2, order: 2 },
              { type: 'line', label: 'Orçamento efetivo', data: MESES.map(() => f.efetivo), borderColor: '#D97706', borderDash: [7, 5], pointRadius: 0, borderWidth: 2, order: 1 }
            ]},
            options: { maintainAspectRatio: false,
              plugins: { legend: { labels: { boxWidth: 12, font: { size: 10 } } }, tooltip: { callbacks: { label: (c) => ' ' + c.dataset.label + ': ' + formatarCompacto(c.parsed.y) } } },
              scales: { y: { ticks: { callback: v => formatarCompacto(v), font: { size: 9 } } }, x: { ticks: { font: { size: 9 } }, grid: { display: false } } } }
          });
        }
      } catch (e) { console.error("graficos", e); }
    }
    function exportarDestinacoesCSV() {
      const f = calcularFinancas();
      const q = (s) => '"' + String(s ?? '').replace(/"/g, '""') + '"';
      let csv = 'Entidade;Titulo;Descricao;Valor (R$)\n';
      f.dest.forEach(d => { csv += [q(d.entidade), q(d.nome), q(d.descricao), Number(d.valor || 0).toFixed(2)].join(';') + '\n'; });
      csv += [q('ORÇAMENTO LOA'), '', '', f.loa.toFixed(2)].join(';') + '\n';
      f.adicionais.forEach(a => { csv += [q('VERBA: ' + a.titulo), q(a.descricao), '', Number(a.valor || 0).toFixed(2)].join(';') + '\n'; });
      csv += [q('ORÇAMENTO EFETIVO'), '', '', f.efetivo.toFixed(2)].join(';') + '\n';
      csv += [q('TOTAL EXECUTADO'), '', '', f.executado.toFixed(2)].join(';') + '\n';
      csv += [q('SALDO'), '', '', f.saldo.toFixed(2)].join(';') + '\n';
      const blob = new Blob(['\ufeff' + csv], { type: 'text/csv;charset=utf-8;' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = 'transparencia-saude-sp.csv';
      document.body.appendChild(a); a.click(); a.remove();
      mostrarToast("CSV exportado!");
    }

    // ===== RENDER PÚBLICO MELHORADO =====
    function iconeProgramaHtml(p) {
      const cat = ((p.categoria || '') + ' ' + (p.nome || '')).toLowerCase();
      let icone = 'heart-handshake', corIcone = 'text-sp-blue bg-blue-50';
      if (cat.includes('psicolog') || cat.includes('mental') || cat.includes('pericia')) { icone = 'brain'; corIcone = 'text-indigo-700 bg-indigo-50'; }
      else if (cat.includes('medicamento') || cat.includes('farmac')) { icone = 'pill'; corIcone = 'text-emerald-700 bg-emerald-50'; }
      return `<div class="w-12 h-12 rounded-xl ${corIcone} flex items-center justify-center mb-3"><i data-lucide="${icone}" class="w-6 h-6"></i></div>`;
    }
    function botaoProgramaHtml(p) {
      const link = (p.link || '').trim();
      const classe = "mt-5 w-full bg-sp-blue hover:bg-sp-darkBlue text-white font-black py-2.5 rounded-lg text-xs uppercase tracking-wide transition shadow";
      if (link.startsWith('#/')) return `<button onclick="irParaPagina('${link.replace('#/', '')}')" class="${classe}">Acessar Programa →</button>`;
      if (link.startsWith('http')) return `<button onclick="window.open('${esc(link)}','_blank','noopener')" class="${classe}">Acessar Programa →</button>`;
      return `<div class="mt-5 w-full bg-neutral-100 text-neutral-400 font-black py-2.5 rounded-lg text-xs uppercase tracking-wide text-center">Em Breve</div>`;
    }
    function cardProgramaHtml(p) {
      return `<div class="bg-white rounded-xl border border-neutral-200 border-t-4 border-sp-blue shadow-sm p-6 flex flex-col card-hover fade-in">
        ${iconeProgramaHtml(p)}
        <span class="text-[9px] font-black uppercase tracking-wider text-sp-blue">${esc(p.categoria || 'Programa')}</span>
        <h4 class="font-black text-neutral-900 text-base uppercase mt-1 leading-tight">${esc(p.nome)}</h4>
        <p class="text-xs text-neutral-500 mt-2 leading-relaxed flex-grow">${esc(p.descricao || '')}</p>
        ${botaoProgramaHtml(p)}
      </div>`;
    }
    function renderizarProgramas() {
      const grid = document.getElementById("gridProgramas"); if (!grid) return;

    // ===== HOSPITAIS MELHORADO =====
    function renderizarHospitais() {
      const grid = document.getElementById("gridHospitais"); if (!grid) return;
      const inputBusca = document.getElementById("buscaHospital");
      const selRegiao = document.getElementById("filtroRegiao");
      const busca = inputBusca ? inputBusca.value.toLowerCase().trim() : "";
      const regiao = selRegiao ? selRegiao.value : "todas";
      const todos = garantirArray(app.hospitais, []);
      const lista = todos.filter(h => {
        const okRegiao = regiao === "todas" || h.regiao === regiao;
        const okBusca = !busca || (h.nome || "").toLowerCase().includes(busca);
        return okRegiao && okBusca;
      });
      // Resumo
      setText("resumoHospUnid", lista.length);
      setText("resumoHospLeitos", lista.reduce((s, h) => s + Number(h.leitos || 0), 0));
      const ocupMedia = lista.length ? lista.reduce((s, h) => s + Number(h.ocupacao || 0), 0) / lista.length : 0;
      setText("resumoHospOcup", ocupMedia.toFixed(0) + "%");
      setText("resumoHospReg", new Set(lista.map(h => h.regiao)).size);

      const semRes = document.getElementById("semResultadoHospital");
      if (lista.length === 0) { grid.innerHTML = ""; if (semRes) semRes.classList.remove("hidden"); return; }
      if (semRes) semRes.classList.add("hidden");

      const coresStatus = {
        "Operando Normalmente": "bg-emerald-100 text-emerald-800",
        "Alta Demanda": "bg-amber-100 text-amber-800",
        "Em Obras / Parcial": "bg-neutral-200 text-neutral-700",
        "Pronto-Socorro Restrito": "bg-red-100 text-red-700"
      };
      const nomesRegiao = { capital: "Capital / Grande SP", campinas: "Campinas", ribeirao: "Ribeirão Preto", santos: "Baixada Santista" };

      grid.innerHTML = lista.map(h => {
        const ocup = Number(h.ocupacao || 0);
        let corOcup = "bg-emerald-500";
        if (ocup >= 85) corOcup = "bg-red-500";
        else if (ocup >= 70) corOcup = "bg-amber-500";
        const esp = (h.especialidades || "").split(",").map(s => s.trim()).filter(Boolean).slice(0, 4);
        return `<div class="bg-white rounded-xl border border-neutral-200 shadow-sm overflow-hidden card-hover flex flex-col fade-in">
          <div class="relative h-44 bg-sp-darkBlue overflow-hidden">
            <img src="${esc(h.foto || IMG_FALLBACK)}" onerror="this.onerror=null;this.src='${IMG_FALLBACK}'" alt="${esc(h.nome)}" class="w-full h-full object-cover">
            <span class="absolute top-2.5 left-2.5 text-[9px] font-black uppercase px-2 py-1 rounded shadow ${coresStatus[h.status] || 'bg-emerald-100 text-emerald-800'}">${esc(h.status || 'Operando')}</span>
            <span class="absolute top-2.5 right-2.5 text-[9px] font-black uppercase px-2 py-1 rounded bg-white/90 text-sp-darkBlue shadow">${esc(h.tipo || 'Unidade')}</span>
          </div>
          <div class="p-5 flex flex-col flex-grow">
            <span class="text-[9px] font-bold uppercase text-sp-blue tracking-wider flex items-center gap-1"><i data-lucide="map-pin" class="w-3 h-3"></i> ${esc(nomesRegiao[h.regiao] || h.regiao)}</span>
            <h4 class="font-black text-neutral-900 text-sm mt-1 leading-tight">${esc(h.nome)}</h4>
            <p class="text-[11px] text-neutral-500 mt-1.5 leading-relaxed line-clamp-2">${esc(h.endereco || '')}</p>

            <div class="mt-3">
              <div class="flex justify-between text-[10px] font-bold text-neutral-600 mb-1">
                <span>Taxa de Ocupação</span><span class="font-black ${ocup>=85?'text-red-600':(ocup>=70?'text-amber-600':'text-emerald-600')}">${ocup}%</span>
              </div>
              <div class="w-full bg-neutral-200 rounded-full h-1.5 overflow-hidden"><div class="${corOcup} h-1.5 rounded-full" style="width:${ocup}%"></div></div>
            </div>

            ${esp.length ? `<div class="mt-3 flex flex-wrap gap-1">${esp.map(e => `<span class="text-[9px] font-bold text-sp-blue bg-blue-50 px-1.5 py-0.5 rounded">${esc(e)}</span>`).join("")}</div>` : ''}

            </div>
          </div>
        </div>`;
      }).join("");
      refreshIcons();
    }

      setText("mNoticiaData", (n.data || '') + (n.autor ? ' • ' + n.autor : '') + (n.leitura ? ' • ' + n.leitura + ' de leitura' : ''));

      const lista = garantirArray(app.equipe, []).filter(m => m.ativo && m.nome && m.nome.trim() !== "");
      const destaque = document.getElementById("cardSecretarioDestaque");
      const secretario = lista.find(m => m.cargo === "Secretário de Estado da Saúde");
      if (destaque) {
        if (secretario) {
          const fotoHtml = (secretario.foto && secretario.foto.startsWith('data:'))
            ? `<img src="${secretario.foto}" alt="${esc(secretario.nome)}" class="w-28 h-28 rounded-2xl object-cover border-4 border-sp-yellow flex-shrink-0 shadow-lg">`
            : `<div class="w-28 h-28 rounded-2xl bg-sp-yellow text-sp-darkBlue flex items-center justify-center border-4 border-white flex-shrink-0 shadow-lg"><i data-lucide="user" class="w-14 h-14"></i></div>`;
          destaque.innerHTML = `<div class="bg-gradient-to-br from-sp-blue to-sp-darkBlue text-white rounded-2xl p-6 shadow-lg relative overflow-hidden">
            <i data-lucide="shield-check" class="absolute -right-8 -bottom-8 w-48 h-48 opacity-10"></i>
            <div class="relative z-10 flex flex-col sm:flex-row items-center sm:items-start gap-5">
              ${fotoHtml}
              <div class="text-center sm:text-left">
                <span class="text-[10px] font-black uppercase tracking-wider bg-sp-yellow text-sp-darkBlue px-2.5 py-1 rounded">Titular da Pasta</span>
                <h3 class="text-2xl sm:text-3xl font-black mt-2">${esc(secretario.nome)}</h3>
                <p class="text-xs text-blue-100 mt-1">${esc(secretario.cargo)}</p>
                ${secretario.descricao ? `<p class="text-xs text-blue-100/80 mt-3 max-w-2xl leading-relaxed">${esc(secretario.descricao)}</p>` : ''}
                <div class="flex flex-wrap gap-3 mt-3 justify-center sm:justify-start">
                  ${secretario.formacao ? `<span class="text-[10px] bg-white/15 px-2 py-1 rounded flex items-center gap-1"><i data-lucide="graduation-cap" class="w-3 h-3"></i> ${esc(secretario.formacao)}</span>` : ''}
                  ${secretario.contato ? `<span class="text-[10px] bg-white/15 px-2 py-1 rounded flex items-center gap-1"><i data-lucide="mail" class="w-3 h-3"></i> ${esc(secretario.contato)}</span>` : ''}
                </div>
              </div>
            </div>
          </div>`;
        } else destaque.innerHTML = "";
      }
      const restantes = lista.filter(m => m.cargo !== "Secretário de Estado da Saúde");
      grid.innerHTML = restantes.length === 0
        ? '<p class="col-span-full text-center text-neutral-400 text-xs font-semibold py-10">Nenhum outro titular nomeado.</p>'
        : restantes.map(m => {
            const fotoHtml = (m.foto && m.foto.startsWith('data:'))
              ? `<img src="${m.foto}" alt="${esc(m.nome)}" class="w-16 h-16 rounded-full object-cover border-2 border-sp-blue flex-shrink-0">`
              : gerarEmblemaPadraoHtml('border-sp-blue', 'bg-sp-darkBlue');
            return `<div class="bg-white rounded-xl border border-neutral-200 shadow-sm p-5 card-hover fade-in">
              <div class="flex items-start gap-4">
                ${fotoHtml}
                <div class="min-w-0 flex-grow">
                  <span class="text-[9px] font-black uppercase text-sp-blue bg-blue-50 px-2 py-0.5 rounded">${esc(m.cargo)}</span>
                  <h4 class="font-black text-neutral-900 text-sm mt-1.5 leading-tight">${esc(m.nome)}</h4>
                  ${m.descricao ? `<p class="text-[11px] text-neutral-500 mt-1 leading-relaxed">${esc(m.descricao)}</p>` : ''}
                </div>
              </div>
              ${(m.formacao || m.contato) ? `<div class="mt-3 pt-3 border-t border-neutral-100 flex flex-wrap gap-2 text-[10px]">
                ${m.formacao ? `<span class="text-neutral-600 bg-neutral-50 px-2 py-0.5 rounded flex items-center gap-1"><i data-lucide="graduation-cap" class="w-3 h-3 text-sp-blue"></i> ${esc(m.formacao)}</span>` : ''}
                ${m.contato ? `<span class="text-neutral-600 bg-neutral-50 px-2 py-0.5 rounded flex items-center gap-1"><i data-lucide="mail" class="w-3 h-3 text-sp-blue"></i> ${esc(m.contato)}</span>` : ''}
              </div>` : ''}
            </div>`;
          }).join("");
      refreshIcons();
    }
    function renderizarEquipeIep() {
      const grid = document.getElementById("gridEquipeIep"); if (!grid) return;
      const lista = garantirArray(app.iepEquipe, []).filter(m => m.ativo && m.nome && m.nome.trim() !== "");
      grid.innerHTML = lista.length === 0
        ? '<p class="col-span-full text-center text-neutral-400 text-xs font-semibold py-8">Lideranças serão publicadas em breve.</p>'
        : lista.map(m => {
            const fotoHtml = (m.foto && m.foto.startsWith('data:'))
              ? `<img src="${m.foto}" alt="${esc(m.nome)}" class="w-16 h-16 rounded-full object-cover border-2 border-indigo-700 flex-shrink-0">`
              : gerarEmblemaPadraoHtml('border-indigo-700', 'bg-indigo-800');
            return `<div class="bg-white rounded-xl border border-neutral-200 shadow-sm p-5 card-hover fade-in">
              <div class="flex items-start gap-4">
                ${fotoHtml}
                <div class="min-w-0 flex-grow">
                  <span class="text-[9px] font-black uppercase text-indigo-700 bg-indigo-50 px-2 py-0.5 rounded">${esc(m.cargo)}</span>
                  <h4 class="font-black text-neutral-900 text-sm mt-1.5 leading-tight">${esc(m.nome)}</h4>
                  ${m.descricao ? `<p class="text-[11px] text-neutral-500 mt-1 leading-relaxed">${esc(m.descricao)}</p>` : ''}
                </div>
              </div>
              ${(m.formacao || m.contato) ? `<div class="mt-3 pt-3 border-t border-neutral-100 flex flex-wrap gap-2 text-[10px]">
                ${m.formacao ? `<span class="text-neutral-600 bg-neutral-50 px-2 py-0.5 rounded flex items-center gap-1"><i data-lucide="graduation-cap" class="w-3 h-3 text-indigo-700"></i> ${esc(m.formacao)}</span>` : ''}
                ${m.contato ? `<span class="text-neutral-600 bg-neutral-50 px-2 py-0.5 rounded flex items-center gap-1"><i data-lucide="phone" class="w-3 h-3 text-indigo-700"></i> ${esc(m.contato)}</span>` : ''}
              </div>` : ''}
            </div>`;
          }).join("");
      refreshIcons();
    }
    function renderizarListaRemediosPublica() {
      const grid = document.getElementById("gridRemediosPublica"); if (!grid) return;
      const inputBusca = document.getElementById("buscaRemedio");
      const busca = inputBusca ? inputBusca.value.toLowerCase().trim() : "";
      const lista = garantirArray(app.medicamentos, []).filter(m =>
        !busca || (m.nome || '').toLowerCase().includes(busca) || (m.categoria || '').toLowerCase().includes(busca) || (m.descricao || '').toLowerCase().includes(busca)
      );
      setText("contagemRemedios", lista.length + " item(ns)");
      grid.innerHTML = lista.length === 0
        ? '<p class="py-8 text-center text-neutral-400 font-semibold">Nenhum medicamento encontrado.</p>'
        : lista.map(m => `<div class="py-3 flex flex-col sm:flex-row sm:items-center justify-between gap-2">
            <div class="min-w-0">
              <div class="flex items-center gap-2 flex-wrap">
                <strong class="text-neutral-900">${esc(m.nome)}</strong>
                <span class="text-[9px] font-bold text-emerald-800 bg-emerald-50 px-1.5 py-0.5 rounded uppercase">${esc(m.categoria || '')}</span>
              </div>
              <p class="text-[11px] text-neutral-500 mt-0.5">${esc(m.descricao || '')}</p>
            </div>
            <button onclick="selecionarRemedioDiretoNoForm('${m.id}')" class="self-end sm:self-center bg-emerald-600 hover:bg-emerald-700 text-white font-black text-[10px] uppercase px-3 py-1.5 rounded-lg shadow-sm transition flex-shrink-0">Pedir Este</button>
          </div>`).join("");
    }

    // ===== ALERTA / OUVIDORIA =====
    function salvarAlerta() {
      app.alerta = {
        ativo: document.getElementById("chkAlertaAtivo").checked,
        nivel: document.getElementById("selAlertaNivel").value,
        mensagem: document.getElementById("adminInputAlerta").value.trim()
      };
      atualizarTudo(true); mostrarToast("Alerta atualizado!");
    }
    function removerAlerta() {
      app.alerta = { ativo: false, nivel: "atencao", mensagem: "" };
      atualizarTudo(true); mostrarToast("Alerta desativado!");
    }
    function salvarOuvidoria(e) {
      e.preventDefault();
      const url = document.getElementById("adminInputOuvidoria").value.trim();
      app.ouvidoria = url || "https://fala.sp.gov.br";
      atualizarTudo(true); mostrarToast("Ouvidoria salva!");
    }

    // ===== SPLASH =====
    let splashResolvido = false;
    function definirSplashProgresso(pct, msg) {
      const barra = document.getElementById("splashBarra");
      const texto = document.getElementById("splashTexto");
      if (barra) barra.style.width = pct + "%";
      if (texto && msg) texto.innerText = msg;
    }
    function ocultarSplash() {
      if (splashResolvido) return;
      splashResolvido = true;
      const s = document.getElementById("splashScreen"); if (!s) return;
      definirSplashProgresso(100, "Pronto!");
      s.classList.add("opacity-0");
      setTimeout(() => { s.style.display = "none"; }, 700);
    }

    // ===== LOGIN =====
    function abrirModalLogin() {
      if (app.logado) { irParaPagina('admin'); return; }
      document.getElementById("modalLogin").style.display = "flex";
      document.getElementById("loginErro").classList.add("hidden");
      setVal("loginUser",""); setVal("loginPass","");
      refreshIcons();
    }
    function fecharModalLogin() { document.getElementById("modalLogin").style.display = "none"; }
    function alternarVerSenha() {
      const input = document.getElementById("loginPass");
      const icone = document.getElementById("iconeOlho");
      if (input.type === "password") { input.type = "text"; icone.setAttribute("data-lucide","eye-off"); }
      else { input.type = "password"; icone.setAttribute("data-lucide","eye"); }
      refreshIcons();
    }
    function realizarLogin(e) {
      e.preventDefault();
      const u = document.getElementById("loginUser").value.trim();
      const p = document.getElementById("loginPass").value.trim();
      if (u === app.user && p === app.pass) {
        app.logado = true; fecharModalLogin();
        document.getElementById("labelAcesso").innerText = "Painel Conectado";
        mostrarToast("Login realizado!"); irParaPagina('admin');
      } else document.getElementById("loginErro").classList.remove("hidden");
    }
    function redefinirSenhaPadrao() {
      if (confirm("Redefinir para admin / saude@sp2026?")) {
        app.user = "admin"; app.pass = "saude@sp2026";
        localStorage.setItem("ses_user","admin"); localStorage.setItem("ses_pass","saude@sp2026");
        setVal("loginUser","admin"); setVal("loginPass","saude@sp2026");
        alert("Redefinido:\nUsuário: admin\nSenha: saude@sp2026");
      }
    }
    function alterarCredenciais(e) {
      e.preventDefault();
      const novoU = document.getElementById("novoUsuario").value.trim();
      const novaP = document.getElementById("novaSenha").value.trim();
      const confP = document.getElementById("confirmaSenha").value.trim();
      if (novaP.length < 5) { alert("Senha mínimo 5 caracteres!"); return; }
      if (novaP !== confP) { alert("Senhas não coincidem!"); return; }
      app.user = novoU; app.pass = novaP;
      localStorage.setItem("ses_user", novoU); localStorage.setItem("ses_pass", novaP);
      setVal("novoUsuario",""); setVal("novaSenha",""); setVal("confirmaSenha","");
      mostrarToast("Credenciais salvas!");
    }
    function deslogar() {
      app.logado = false;
      document.getElementById("labelAcesso").innerText = "Área do Servidor";
      irParaPagina('inicio'); mostrarToast("Sessão finalizada!");
    }
    function mudarAba(aba) {
      const abas = ["transparencia","iep","remedios","hospitais","equipe","programas","alerta","noticias"];
      abas.forEach(a => {
        const sec = document.getElementById("sec" + a.charAt(0).toUpperCase() + a.slice(1));
        const tab = document.getElementById("tab" + a.charAt(0).toUpperCase() + a.slice(1));
        if (a === aba) {
          if (sec) sec.classList.remove("hidden");
          if (tab) tab.className = "px-3 py-2 rounded text-xs font-bold uppercase bg-sp-blue text-white shadow-sm flex-shrink-0";
        } else {
          if (sec) sec.classList.add("hidden");
          if (tab) tab.className = "px-3 py-2 rounded text-xs font-bold uppercase bg-white text-neutral-700 hover:bg-neutral-100 flex-shrink-0";
        }
      });
      refreshIcons();
    }
    function abrirModalAvisoRP() { document.getElementById("modalAvisoRP").style.display = "flex"; refreshIcons(); }
    function fecharModalAvisoRP() { document.getElementById("modalAvisoRP").style.display = "none"; }
    function alternarContraste() { document.body.classList.toggle("alto-contraste"); }
    let nivelFonte = 0;
    function ajustarFonte(delta) {
      nivelFonte = delta === 0 ? 0 : Math.max(-2, Math.min(3, nivelFonte + delta));
      document.documentElement.style.fontSize = (100 + (nivelFonte * 10)) + "%";
    }
  </script>
</body>
</html>
